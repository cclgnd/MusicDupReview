name: Feature request
description: Propose a user-facing improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow pain or missing capability.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Keep scope small and testable.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: File-safety requirements
      description: Include confirmation dialogs, recycle-bin behavior, rollback, and blocked destructive paths.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - ...
        - Tests cover ...
        - No local databases or reports are committed.
    validations:
      required: true
