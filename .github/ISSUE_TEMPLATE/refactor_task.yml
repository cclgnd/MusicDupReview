name: Refactor task
description: Improve structure without changing user-visible behavior.
title: "[Refactor]: "
labels: ["refactor"]
body:
  - type: textarea
    id: target
    attributes:
      label: Target area
      description: Name files, classes, or services affected.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain the maintainability issue and why the change is worth it.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: State behavior that must not change.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: List required tests or manual checks.
    validations:
      required: true
